# Builds the Switch portlib packages (Vulkan, and OpenGL via Zink) and every
# smoke-test NRO in the same toolchain container the Makefile uses. A v* tag
# also publishes them as a release, ready to unpack into $DEVKITPRO/portlibs/switch.
name: switch

on:
  push:
    branches: [switch]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - name: Toolchain image
        run: make image CONTAINER=docker

      # The whole Makefile runs inside the toolchain container (it has devkitA64
      # for the packaging step, which a stock runner does not).
      - name: Vulkan and OpenGL packages
        run: docker run --rm -v "$PWD:/work" -w /work nxvk make gl CONTAINER=

      # The gl_* apps link the driver and the GL stack out of one build tree, so
      # the driver has to exist in the OpenGL build directory too.
      - name: Driver inside the OpenGL build
        run: docker run --rm -v "$PWD:/work" -w /work nxvk make driver CROSS=switch/build/cross-zink CONTAINER=

      # The smoke apps include generated SPIR-V headers; build-nro.sh expects them
      # to exist already (the container carries glslangValidator).
      - name: Smoke-test shaders
        run: docker run --rm -v "$PWD:/work" -w /work nxvk bash switch/smoke/shaders/gen-shaders.sh

      - name: Smoke-test NROs
        run: docker run --rm -v "$PWD:/work" -w /work nxvk bash switch/build/build-all-nros.sh

      - name: Bundle
        run: |
          version=$(cat VERSION)
          sudo chown -R "$(id -u):$(id -g)" switch/build/pkg switch/smoke/out
          mkdir -p dist
          tar -C switch/build/pkg -cJf dist/nxvk-switch-portlib-${version}.tar.xz .
          tar -C switch/smoke/out -cJf dist/nxvk-switch-smoke-nros-${version}.tar.xz .
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: nxvk-switch
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" \
            --notes "Prebuilt nxvk for Nintendo Switch (devkitA64). Unpack the portlib archive into \$DEVKITPRO/portlibs/switch; link with pkg-config nxvk (Vulkan) or nxvk-gl (OpenGL/EGL). The smoke-test NROs exercise the driver on hardware; see switch/smoke/README.md."
